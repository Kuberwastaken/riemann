name = "RiemannFormal"
version = "0.1.0"
defaultTargets = ["RiemannFormal"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

# Pinned to the same Mathlib revision as anthropics/zeta-23-lean (tag v1.0), so the
# criterion layer can later `require` Zeta23 and share prebuilt artifacts.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "51e6992efd06126df61a496bebf8f49482a4e129"

[[lean_lib]]
name = "RiemannFormal"
